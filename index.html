<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF7E6">
<title>Little Learner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7e6;color:#2d2a26}
.app{max-width:560px;margin:auto;min-height:100vh;padding:24px 18px 32px}
header{text-align:center;padding:18px 0 24px}h1{font-size:36px;margin:0 0 6px}header p{margin:0;color:#746f67;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tile{border:0;border-radius:24px;padding:24px 14px;background:white;box-shadow:0 6px 18px #00000010;font-size:18px;font-weight:700;min-height:145px}
.tile .emoji{display:block;font-size:58px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.hidden{display:none}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{border:0;background:white;border-radius:14px;padding:10px 14px;font-size:20px}
h2{margin:0;font-size:28px}
.animals{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.animal{border:0;border-radius:22px;background:white;padding:18px;box-shadow:0 5px 15px #0000000d;position:relative;overflow:hidden;min-height:205px;transition:transform .18s ease,box-shadow .18s ease}
.animal:active{transform:scale(.97)}
.animal.playing{box-shadow:0 8px 24px #00000018;transform:translateY(-2px)}
.animal .emoji-wrap{height:105px;display:flex;align-items:center;justify-content:center;position:relative}
.animal .emoji{font-size:72px;display:block;line-height:1;transform-origin:center bottom;will-change:transform}
.animal .name{font-size:26px;color:#1683ff;font-weight:800;margin-top:6px;display:block}
.animal .sound{font-size:20px;color:#777;font-weight:700;margin-top:6px;display:block}
.animal .speech{position:absolute;top:10px;right:10px;background:#ffcf5c;border-radius:14px;padding:5px 9px;font-size:13px;font-weight:900;opacity:0;transform:scale(.7) translateY(5px);transition:.18s ease;pointer-events:none}
.animal.playing .speech{opacity:1;transform:scale(1) translateY(0)}
.animal.playing .emoji{animation:animalAction .85s ease-in-out 1}
.animal.cat.playing .emoji,.animal.dog.playing .emoji,.animal.tiger.playing .emoji{animation:walk .9s ease-in-out 1}
.animal.elephant.playing .emoji{animation:trumpet .9s ease-in-out 1}
.animal.lion.playing .emoji{animation:roar .8s ease-in-out 1}
.animal.monkey.playing .emoji{animation:jump .75s ease-in-out 1}
.animal.cow.playing .emoji{animation:bob .8s ease-in-out 1}
.animal.rabbit.playing .emoji{animation:hop .75s ease-in-out 1}
@keyframes animalAction{0%,100%{transform:scale(1)}35%{transform:scale(1.12) rotate(-3deg)}65%{transform:scale(1.08) rotate(3deg)}}
@keyframes walk{0%{transform:translateX(-12px) rotate(-4deg)}25%{transform:translateX(8px) rotate(4deg)}50%{transform:translateX(-7px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes trumpet{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-8deg) translateY(-3px)}50%{transform:rotate(8deg) scale(1.08)}75%{transform:rotate(-6deg) translateY(-2px)}}
@keyframes roar{0%,100%{transform:scale(1)}30%{transform:scale(1.16) rotate(-2deg)}55%{transform:scale(1.08) rotate(2deg)}75%{transform:scale(1.12)}}
@keyframes jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-18px) rotate(-5deg)}65%{transform:translateY(-7px) rotate(5deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}60%{transform:translateY(3px)}}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px) translateX(7px)}70%{transform:translateY(0) translateX(-5px)}}
.animal{position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}.animal .emoji-wrap{display:inline-block;transform-origin:50% 80%}.animal:not(.playing) .emoji-wrap{animation:idleFloat 2.8s ease-in-out infinite}.animal:nth-child(2n) .emoji-wrap{animation-delay:-1.1s}.animal:nth-child(3n) .emoji-wrap{animation-delay:-1.8s}.animal.playing{transform:translateY(-3px) scale(1.02)}.animal.playing .emoji-wrap{animation:none}.animal.dog.playing .emoji{animation:walk .9s ease-in-out 1}.animal.cat.playing .emoji{animation:catMove .8s ease-in-out 1}.animal.cow.playing .emoji{animation:bob .8s ease-in-out 1}.animal.lion.playing .emoji{animation:roar .8s ease-in-out 1}.animal.elephant.playing .emoji{animation:trumpet .9s ease-in-out 1}.animal.monkey.playing .emoji{animation:jump .75s ease-in-out 1}.animal.tiger.playing .emoji{animation:roar .8s ease-in-out 1}.animal.rabbit.playing .emoji{animation:hop .75s ease-in-out 1}@keyframes idleFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-2deg)}}@keyframes catMove{0%,100%{transform:translateX(0) rotate(0) scale(1)}25%{transform:translateX(-7px) rotate(-5deg) scale(1.04)}50%{transform:translateX(8px) rotate(5deg) scale(1.08)}75%{transform:translateX(-4px) rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.animal.playing .emoji{animation:none!important}}
.quiz{text-align:center}.question{font-size:25px;font-weight:800;margin:20px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{border:0;background:white;border-radius:22px;padding:22px;font-size:65px;box-shadow:0 5px 15px #0000000d}
.feedback{min-height:38px;margin:18px 0;font-size:21px;font-weight:800}
.primary{border:0;border-radius:18px;padding:14px 22px;background:#ffcf5c;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌈 Little Learner</h1>
    <p>Learn, play and have fun!</p>
  </header>

  <main id="home">
    <div class="grid">
      <button class="tile" onclick="showAnimals()"><span class="emoji">🐾</span>Animals</button>
      <button class="tile" onclick="comingSoon('Colors')"><span class="emoji">🎨</span>Colors</button>
      <button class="tile" onclick="comingSoon('Numbers')"><span class="emoji">🔢</span>Numbers</button>
      <button class="tile" onclick="comingSoon('ABC')"><span class="emoji">🔤</span>ABC</button>
    </div>
  </main>

  <main id="animals" class="hidden">
    <div class="topbar"><button class="back" onclick="goHome()">←</button><h2>🐾 Animals</h2></div>
    <div class="animals" id="animalList"></div>
    <div style="text-align:center;margin-top:20px"><button class="primary" onclick="startQuiz()">🎮 Play Quiz</button></div>
  </main>

  <main id="quiz" class="hidden quiz">
    <div class="topbar"><button class="back" onclick="showAnimals()">←</button><h2>🎮 Animal Quiz</h2></div>
    <div class="question" id="question"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <button class="primary hidden" id="next" onclick="nextQuestion()">Next ➜</button>
  </main>
</div>

<script>
const animals=[
  {name:"Dog",emoji:"🐶",sound:"Woof woof!"},
  {name:"Cat",emoji:"🐱",sound:"Meow!"},
  {name:"Cow",emoji:"🐮",sound:"Moo!"},
  {name:"Lion",emoji:"🦁",sound:"Roar!"},
  {name:"Elephant",emoji:"🐘",sound:"Trumpet!"},
  {name:"Monkey",emoji:"🐒",sound:"Ooh ooh aah aah!"},
  {name:"Tiger",emoji:"🐯",sound:"Roar!"},
  {name:"Rabbit",emoji:"🐰",sound:"Hop hop!"}
];

function speak(text){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.rate=.82; u.pitch=1.15;
    speechSynthesis.speak(u);
  }
}
function show(id){["home","animals","quiz"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function goHome(){show("home")}
function showAnimals(){
  show("animals");
  document.getElementById("animalList").innerHTML=animals.map((a,i)=>`
    <button class="animal ${a.name.toLowerCase()}" onclick="playAnimal(${i}, this)">
      <span class="speech">${a.sound.replace(/!$/, "!")}</span>
      <span class="emoji-wrap"><span class="emoji">${a.emoji}</span></span>
      <span class="name">${a.name}</span>
      <span class="sound">${a.sound}</span>
    </button>`).join("");
}

function playAnimal(index, card){
  const a=animals[index];
  document.querySelectorAll(".animal.playing").forEach(el=>el.classList.remove("playing"));
  card.classList.remove("playing");
  void card.offsetWidth;
  card.classList.add("playing");
  speak(`${a.name}. ${a.sound}`);
  setTimeout(()=>card.classList.remove("playing"),1000);
}
function comingSoon(name){alert(name+" is coming soon! 🌟")}
let current, score=0;
function startQuiz(){score=0;nextQuestion();show("quiz")}
function nextQuestion(){
  current=animals[Math.floor(Math.random()*animals.length)];
  let options=[current];
  while(options.length<3){
    const a=animals[Math.floor(Math.random()*animals.length)];
    if(!options.includes(a)) options.push(a);
  }
  options.sort(()=>Math.random()-.5);
  document.getElementById("question").textContent="Where is the "+current.name+"?";
  document.getElementById("feedback").textContent="";
  document.getElementById("next").classList.add("hidden");
  document.getElementById("choices").innerHTML=options.map(a=>
    `<button class="choice" onclick="answer('${a.name}')">${a.emoji}</button>`).join("");
  speak("Where is the "+current.name+"?");
}
function answer(name){
  const feedback=document.getElementById("feedback");
  if(name===current.name){
    score++; feedback.textContent="🎉 Great job!";
    speak("Great job!");
  }else{
    feedback.textContent="😊 Try again!";
    speak("Try again!");
    return;
  }
  document.getElementById("next").classList.remove("hidden");
}
</script>
</body>
</html>
